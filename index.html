<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Training Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="theme-color" content="#0e1014">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236ee7f2'/%3E%3Cstop offset='50%25' stop-color='%23b38af0'/%3E%3Cstop offset='100%25' stop-color='%23f4c56b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='%23171a20'/%3E%3Ccircle cx='90' cy='90' r='58' fill='none' stroke='url(%23g)' stroke-width='10'/%3E%3Ctext x='90' y='104' font-family='Arial' font-weight='700' font-size='54' fill='%23eef1f5' text-anchor='middle'%3ETL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0e1014; min-height:100vh; }
  body { padding: calc(env(safe-area-inset-top, 0px) + 56px) 16px 40px; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<div id="training-log-root">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Training log: track daily quests for protein, workout, sleep and focus work to earn XP, build streaks, and unlock badges.</h2>

  <div style="max-width:680px;margin:0 auto;font-family:'Rajdhani',var(--font-sans, sans-serif);">

    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px 20px;background:#171a20;border-radius:14px;border:1px solid #2a2f38;">
      <div id="level-badge" style="flex-shrink:0;width:56px;height:56px;border-radius:50%;background:conic-gradient(from 0deg,#6ee7f2,#b38af0,#f4c56b,#6ee7f2);display:flex;align-items:center;justify-content:center;">
        <div style="width:48px;height:48px;border-radius:50%;background:#171a20;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <span style="font-size:9px;color:#93a0b0;letter-spacing:0.5px;">LVL</span>
          <span id="level-num" style="font-size:18px;font-weight:700;color:#eef1f5;line-height:1;">1</span>
        </div>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
          <span style="font-size:14px;font-weight:600;color:#eef1f5;letter-spacing:0.3px;">TRAINING LOG</span>
          <span id="xp-label" style="font-size:12px;color:#93a0b0;">0 / 150 XP</span>
        </div>
        <div style="height:8px;border-radius:4px;background:#2a2f38;overflow:hidden;">
          <div id="xp-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#2dd4bf,#6ee7f2);transition:width .4s ease;"></div>
        </div>
      </div>
      <div style="flex-shrink:0;text-align:center;padding-left:12px;border-left:1px solid #2a2f38;">
        <div id="streak-num" style="font-size:22px;font-weight:700;color:#f4c56b;line-height:1;">0</div>
        <div style="font-size:10px;color:#93a0b0;letter-spacing:0.5px;">DAY STREAK</div>
      </div>
    </div>

    <div style="font-size:12px;font-weight:600;color:#93a0b0;letter-spacing:0.8px;margin-bottom:10px;">TODAY'S QUESTS</div>
    <div id="quest-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;"></div>

    <div style="font-size:12px;font-weight:600;color:#93a0b0;letter-spacing:0.8px;margin-bottom:10px;">WEEKLY BOSS</div>
    <div id="boss-card" style="margin-bottom:24px;"></div>

    <div style="font-size:12px;font-weight:600;color:#93a0b0;letter-spacing:0.8px;margin-bottom:10px;">CARD COLLECTION</div>
    <div id="badge-strip" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:24px;"></div>

    <div style="font-size:12px;font-weight:600;color:#93a0b0;letter-spacing:0.8px;margin-bottom:10px;">XP HISTORY</div>
    <div id="history-list" style="display:flex;flex-direction:column;gap:8px;"></div>

  </div>

  <div id="reveal-overlay" style="display:none;position:fixed;inset:0;background:rgba(10,12,16,0.85);align-items:center;justify-content:center;z-index:9999;">
    <div id="reveal-card" style="width:220px;height:300px;border-radius:16px;cursor:pointer;perspective:1000px;"></div>
  </div>
</div>

<style>
  #training-log-root * { box-sizing: border-box; }
  #training-log-root button { font-family: inherit; }
  .quest-card { position:relative; background:#171a20; border:1px solid #2a2f38; border-radius:12px; padding:14px 12px; cursor:pointer; transition:transform .15s ease, border-color .15s ease; }
  .quest-card:hover { transform: translateY(-2px); border-color:#3a4150; }
  .quest-card.done { border-color: var(--rc,#2dd4bf); background:#181f1d; }
  .quest-icon { font-size:20px; margin-bottom:8px; display:block; }
  .quest-name { font-size:13px; font-weight:600; color:#eef1f5; margin-bottom:2px; }
  .quest-xp { font-size:11px; color:#93a0b0; }
  .quest-check { position:absolute; top:10px; right:10px; width:18px; height:18px; border-radius:50%; border:1.5px solid #3a4150; display:flex; align-items:center; justify-content:center; }
  .quest-card.done .quest-check { background: var(--rc,#2dd4bf); border-color: var(--rc,#2dd4bf); }
  .badge-slot { aspect-ratio:2/3; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:10px; text-align:center; padding:6px; }
  .badge-slot.locked { background:#171a20; border:1px dashed #2a2f38; color:#4a5160; }
  .badge-slot.unlocked { border:1px solid transparent; color:#171a20; font-weight:700; }
  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
</style>

<script>
(function(){
  var STORE_KEY = 'training-log-state';
  var QUESTS = [
    {id:'protein', name:'Protein', xp:20, icon:'\u25C9', color:'#2dd4bf'},
    {id:'workout', name:'Workout', xp:30, icon:'\u25B2', color:'#5b9df0'},
    {id:'sleep', name:'Sleep', xp:15, icon:'\u25D0', color:'#a78bfa'},
    {id:'focus', name:'Focus work', xp:15, icon:'\u2605', color:'#f4c56b'}
  ];
  var BADGES = [
    {id:'bronze', streak:3, name:'3-day streak', bg:'linear-gradient(135deg,#8b6a3f,#c99b5f)'},
    {id:'silver', streak:7, name:'7-day streak', bg:'linear-gradient(135deg,#8a94a3,#d4dae2)'},
    {id:'gold', streak:14, name:'14-day streak', bg:'linear-gradient(135deg,#b8860b,#f4c56b)'},
    {id:'legendary', streak:30, name:'30-day streak', bg:'linear-gradient(270deg,#6ee7f2,#b38af0,#f4c56b,#6ee7f2)', holo:true}
  ];

  function todayStr(d){ d = d || new Date(); return d.toISOString().slice(0,10); }
  function weekStr(d){
    d = d || new Date();
    var onejan = new Date(d.getFullYear(),0,1);
    var week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
    return d.getFullYear() + '-W' + week;
  }
  function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

  var state = null;

  function defaultState(){
    return {
      xp: 0,
      streak: 0,
      lastActiveDate: null,
      today: { date: todayStr(), protein:false, workout:false, sleep:false, focus:false, xpEarned:0 },
      week: { id: weekStr(), weighIn: false },
      badges: [],
      history: []
    };
  }

  async function load(){
    try {
      var res = await window.storage.get(STORE_KEY, false);
      state = res && res.value ? JSON.parse(res.value) : defaultState();
    } catch(e) {
      state = defaultState();
    }
    if (typeof state.today.xpEarned !== 'number') state.today.xpEarned = 0;
    if (!Array.isArray(state.history)) state.history = [];
    rolloverIfNeeded();
    render();
  }

  async function save(){
    try { await window.storage.set(STORE_KEY, JSON.stringify(state), false); }
    catch(e) { console.error('Storage error', e); }
  }

  function rolloverIfNeeded(){
    var today = todayStr();
    if (state.today.date !== today) {
      var allDone = state.today.protein && state.today.workout && state.today.sleep;
      var gap = state.lastActiveDate ? daysBetween(state.lastActiveDate, today) : 99;
      if (allDone && gap === 1) {
        state.streak += 1;
      } else if (gap > 1 || !allDone) {
        state.streak = 0;
      }
      state.lastActiveDate = today;
      var completed = QUESTS.filter(function(q){ return state.today[q.id]; }).map(function(q){ return q.id; });
      state.history.unshift({ date: state.today.date, xp: state.today.xpEarned || 0, quests: completed });
      if (state.history.length > 30) state.history = state.history.slice(0, 30);
      state.today = { date: today, protein:false, workout:false, sleep:false, focus:false, xpEarned:0 };
    }
    var wk = weekStr();
    if (state.week.id !== wk) {
      state.week = { id: wk, weighIn: false };
    }
  }

  function xpForLevel(lvl){ return 150 + (lvl-1)*20; }
  function computeLevel(totalXp){
    var lvl = 1, remaining = totalXp, req = xpForLevel(lvl);
    while (remaining >= req) {
      remaining -= req;
      lvl++;
      req = xpForLevel(lvl);
    }
    return { level: lvl, into: remaining, req: req };
  }

  function fireConfetti(){
    if (typeof confetti !== 'function') return;
    confetti({ particleCount: 40, spread: 55, startVelocity: 28, origin: { x: 0.5, y: 0.55 }, colors: ['#2dd4bf','#5b9df0','#a78bfa','#f4c56b'] });
  }
  function fireLevelUpConfetti(){
    if (typeof confetti !== 'function') return;
    var end = Date.now() + 1200;
    (function frame(){
      confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.4 }, colors: ['#6ee7f2','#b38af0','#f4c56b'] });
      confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.4 }, colors: ['#6ee7f2','#b38af0','#f4c56b'] });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  function checkBadges(){
    var newly = [];
    BADGES.forEach(function(b){
      if (state.streak >= b.streak && state.badges.indexOf(b.id) === -1) {
        state.badges.push(b.id);
        newly.push(b);
      }
    });
    return newly;
  }

  function toggleQuest(id){
    var q = QUESTS.find(function(x){ return x.id===id; });
    var wasDone = state.today[id];
    var prevLevel = computeLevel(state.xp).level;
    var delta = wasDone ? -q.xp : q.xp;
    state.today[id] = !wasDone;
    state.xp += delta;
    if (state.xp < 0) state.xp = 0;
    state.today.xpEarned = (state.today.xpEarned || 0) + delta;

    if (!wasDone && state.today.protein && state.today.workout && state.today.sleep && state.lastActiveDate !== state.today.date) {
      state.lastActiveDate = state.today.date;
    }

    var newBadges = checkBadges();
    var newLevel = computeLevel(state.xp).level;
    save();
    render();
    if (!wasDone) fireConfetti();
    if (newLevel > prevLevel) fireLevelUpConfetti();
    if (newBadges.length) revealBadge(newBadges[0]);
  }

  function toggleWeighIn(){
    var was = state.week.weighIn;
    var prevLevel = computeLevel(state.xp).level;
    var delta = was ? -25 : 25;
    state.week.weighIn = !was;
    state.xp += delta;
    if (state.xp < 0) state.xp = 0;
    state.today.xpEarned = (state.today.xpEarned || 0) + delta;
    var newLevel = computeLevel(state.xp).level;
    save();
    render();
    if (!was) fireConfetti();
    if (newLevel > prevLevel) fireLevelUpConfetti();
  }

  function formatHistoryDate(dstr){
    var d = new Date(dstr + 'T00:00:00');
    var t = new Date(todayStr() + 'T00:00:00');
    var diff = Math.round((t - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }

  function revealBadge(badge){
    var overlay = document.getElementById('reveal-overlay');
    var card = document.getElementById('reveal-card');
    card.style.background = '#1c2027';
    card.style.border = '1px solid #2a2f38';
    card.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#93a0b0;font-size:13px;letter-spacing:1px;">TAP TO REVEAL</div>';
    overlay.style.display = 'flex';

    card.onclick = function(){
      card.style.background = badge.bg;
      if (badge.holo) {
        card.style.backgroundSize = '400% 400%';
        card.style.animation = 'shimmer 2.5s linear infinite';
      }
      card.style.border = 'none';
      card.innerHTML = '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#171a20;font-weight:700;">' +
        '<div style="font-size:32px;">\u2605</div>' +
        '<div style="font-size:15px;">' + badge.name + '</div>' +
        '<div style="font-size:11px;font-weight:600;opacity:0.75;">UNLOCKED</div>' +
        '</div>';
      card.onclick = function(){ overlay.style.display = 'none'; };
    };
  }

  function render(){
    var lv = computeLevel(state.xp);
    document.getElementById('level-num').textContent = lv.level;
    document.getElementById('xp-label').textContent = lv.into + ' / ' + lv.req + ' XP';
    document.getElementById('xp-bar').style.width = Math.round((lv.into/lv.req)*100) + '%';
    document.getElementById('streak-num').textContent = state.streak;

    var grid = document.getElementById('quest-grid');
    grid.innerHTML = '';
    QUESTS.forEach(function(q){
      var done = state.today[q.id];
      var el = document.createElement('div');
      el.className = 'quest-card' + (done ? ' done' : '');
      el.style.setProperty('--rc', q.color);
      el.innerHTML = '<div class="quest-check"></div>' +
        '<span class="quest-icon" style="color:' + q.color + '">' + q.icon + '</span>' +
        '<div class="quest-name">' + q.name + '</div>' +
        '<div class="quest-xp">+' + q.xp + ' XP</div>';
      el.onclick = function(){ toggleQuest(q.id); };
      grid.appendChild(el);
    });

    var boss = document.getElementById('boss-card');
    var wDone = state.week.weighIn;
    boss.innerHTML = '';
    var bEl = document.createElement('div');
    bEl.className = 'quest-card' + (wDone ? ' done' : '');
    bEl.style.setProperty('--rc', '#f4c56b');
    bEl.style.display = 'flex';
    bEl.style.alignItems = 'center';
    bEl.style.gap = '14px';
    bEl.innerHTML = '<span class="quest-icon" style="margin:0;color:#f4c56b;font-size:26px;">\u25C6</span>' +
      '<div style="flex:1;"><div class="quest-name" style="font-size:14px;">Weekly weigh-in</div>' +
      '<div class="quest-xp">Same day, same conditions &bull; +25 XP</div></div>' +
      '<div class="quest-check" style="position:static;"></div>';
    bEl.onclick = function(){ toggleWeighIn(); };
    boss.appendChild(bEl);

    var strip = document.getElementById('badge-strip');
    strip.innerHTML = '';
    BADGES.forEach(function(b){
      var unlocked = state.badges.indexOf(b.id) !== -1;
      var el = document.createElement('div');
      el.className = 'badge-slot ' + (unlocked ? 'unlocked' : 'locked');
      if (unlocked) {
        el.style.background = b.bg;
        if (b.holo) { el.style.backgroundSize = '400% 400%'; el.style.animation = 'shimmer 3s linear infinite'; }
        el.innerHTML = '<div style="font-size:18px;">\u2605</div><div>' + b.name + '</div>';
      } else {
        el.innerHTML = '<div style="font-size:18px;">?</div><div>' + b.streak + '-day streak</div>';
      }
      strip.appendChild(el);
    });

    var histList = document.getElementById('history-list');
    histList.innerHTML = '';
    var todayCompleted = QUESTS.filter(function(q){ return state.today[q.id]; }).map(function(q){ return q.id; });
    var entries = [{ date: state.today.date, xp: state.today.xpEarned || 0, quests: todayCompleted }].concat(state.history);
    if (entries.length === 0) {
      histList.innerHTML = '<div style="font-size:12px;color:#4a5160;padding:8px 2px;">No activity logged yet.</div>';
    } else {
      entries.slice(0, 14).forEach(function(e){
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#171a20;border:1px solid #2a2f38;border-radius:10px;';
        var iconsHtml = e.quests.map(function(qid){
          var q = QUESTS.find(function(x){ return x.id === qid; });
          return q ? '<span style="color:' + q.color + ';font-size:13px;margin-right:4px;">' + q.icon + '</span>' : '';
        }).join('');
        var xpColor = e.xp > 0 ? '#2dd4bf' : (e.xp < 0 ? '#e2555a' : '#93a0b0');
        row.innerHTML = '<div style="display:flex;align-items:center;gap:10px;">' +
          '<span style="font-size:13px;color:#eef1f5;font-weight:600;min-width:60px;">' + formatHistoryDate(e.date) + '</span>' +
          '<span>' + (iconsHtml || '<span style="font-size:11px;color:#4a5160;">no quests</span>') + '</span>' +
          '</div>' +
          '<span style="font-size:13px;font-weight:700;color:' + xpColor + ';">' + (e.xp > 0 ? '+' : '') + e.xp + ' XP</span>';
        histList.appendChild(row);
      });
    }
  }

  load();
})();
</script>
</body>
</html>
